<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LifeBoard-taches</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Mes taches</h1>
        </header>

        <main>
            <section>
                <form id="formulaire-tache">
                    <label for="titre-tache">Nouvelle tache</label>
                    <input type="text" id="titre-tache" placeholder="EX: faire le menage">
                    <label for="categories-taches">categories:</label>
                    <select id="categories-taches">
                        <option value="etude">Etude</option>
                        <option value="projet">Projet</option>
                        <option value="autre">Autre</option>
                        <option value="soin">Soin</option>
                    </select>
                    <label for="dateEcheance"> Echeance:</label>
                    <input type="date" id="dateEcheance">
                    <button type="submit">Ajouter</button>
                    
                </form>
            </section>

            <div id="filtres">
                <button type="button" data-filtre="toutes">Toutes</button>
                <button type="button" data-filtre="afaire">A faire</button>
                <button type="button" data-filtre="terminees">Terminees</button>
            </div>

            <section>
                <ul id="liste-taches">

                </ul>
                <p id="pasdetache"></p>
                <p id="nombretache"></p>
            </section>
        </main>
        <script src="taches.js"></script>
    </body>
</html>
